name: CMake

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    name: OS ${{ matrix.os }} | Compiler ${{ matrix.compiler-name }} ${{ matrix.compiler-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler-name: MSVC
            compiler-version: default
            cc: ''
            cxx: ''
          # MacOS CLANG
          - os: macos-26
            compiler-name: llvm
            compiler-version: 20
            cc: /opt/homebrew/opt/llvm@20/bin/clang-20
            cxx: /opt/homebrew/opt/llvm@20/bin/clang++
            extra-cmake-arguments: >-
              -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I/opt/homebrew/opt/libomp/include"
              -DOpenMP_CXX_LIB_NAMES="omp"
              -DOpenMP_omp_LIBRARY="/opt/homebrew/opt/libomp/lib/libomp.dylib"
          - os: macos-26
            compiler-name: llvm
            compiler-version: 21
            cc: /opt/homebrew/opt/llvm@21/bin/clang-21
            cxx: /opt/homebrew/opt/llvm@21/bin/clang++
            extra-cmake-arguments: >-
              -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I/opt/homebrew/opt/libomp/include"
              -DOpenMP_CXX_LIB_NAMES="omp"
              -DOpenMP_omp_LIBRARY="/opt/homebrew/opt/libomp/lib/libomp.dylib"
          - os: macos-26
            compiler-name: llvm
            compiler-version: 22
            cc: /opt/homebrew/opt/llvm@22/bin/clang-22
            cxx: /opt/homebrew/opt/llvm@22/bin/clang++
            extra-cmake-arguments: >-
              -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I/opt/homebrew/opt/libomp/include"
              -DOpenMP_CXX_LIB_NAMES="omp"
              -DOpenMP_omp_LIBRARY="/opt/homebrew/opt/libomp/lib/libomp.dylib"
          - os: macos-26
            compiler-name: llvm
            compiler-version: 23
            cc: /opt/homebrew/opt/llvm@23/bin/clang-23
            cxx: /opt/homebrew/opt/llvm@23/bin/clang++
            extra-cmake-arguments: >-
              -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I/opt/homebrew/opt/libomp/include"
              -DOpenMP_CXX_LIB_NAMES="omp"
              -DOpenMP_omp_LIBRARY="/opt/homebrew/opt/libomp/lib/libomp.dylib"
          # MacOS GCC
          - os: macos-26
            compiler-name: gcc
            compiler-version: 13
            cc: gcc-13
            cxx: g++-13
          - os: macos-26
            compiler-name: gcc
            compiler-version: 14
            cc: gcc-14
            cxx: g++-14
          - os: macos-26
            compiler-name: gcc
            compiler-version: 15
            cc: gcc-15
            cxx: g++-15
          - os: macos-26
            compiler-name: gcc
            compiler-version: 16
            cc: gcc-16
            cxx: g++-16
          # Ubuntu CLANG
          - os: ubuntu-26.04
            compiler-name: llvm
            compiler-version: 20
            cc: clang-20
            cxx: clang++-20
          - os: ubuntu-26.04
            compiler-name: llvm
            compiler-version: 21
            cc: clang-21
            cxx: clang++-21
          - os: ubuntu-26.04
            compiler-name: llvm
            compiler-version: 22
            cc: clang-22
            cxx: clang++-22
          - os: ubuntu-26.04
            compiler-name: llvm
            compiler-version: 23
            cc: clang-23
            cxx: clang++-23
          # Ubuntu GCC
          - os: ubuntu-26.04
            compiler-name: gcc
            compiler-version: 13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-26.04
            compiler-name: gcc
            compiler-version: 14
            cc: gcc-14
            cxx: g++-14
          - os: ubuntu-26.04
            compiler-name: gcc
            compiler-version: 15
            cc: gcc-15
            cxx: g++-15
          - os: ubuntu-26.04
            compiler-name: gcc
            compiler-version: 16
            cc: gcc-16
            cxx: g++-16

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM on MacOS
        if: ${{ matrix.os == 'macos-26' && matrix.compiler-name == 'llvm' }}
        run: brew install llvm@${{ matrix.compiler-version }} libomp

      - name: Install GCC on MacOS
        if: ${{ matrix.os == 'macos-26' && matrix.compiler-name == 'gcc' }}
        run: brew install gcc@${{ matrix.compiler-version }}

      - name: Install LLVM on Ubuntu
        if: ${{ matrix.os == 'ubuntu-26.04' && matrix.compiler-name == 'llvm' }}
        run: |
          if [ "${{ matrix.compiler-version }}" -eq 23 ]; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 23
          else
            sudo apt-get update
          fi
          sudo apt-get install -y clang-${{ matrix.compiler-version }} libomp-${{ matrix.compiler-version }}-dev

      - name: Install GCC on Ubuntu
        if: ${{ matrix.os == 'ubuntu-26.04' && matrix.compiler-name == 'gcc' }}
        run: sudo apt-get install -y g++-${{ matrix.compiler-version }}

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. CMAKE_BUILD_TYPE is used by single-configuration generators.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.extra-cmake-arguments }}

      - name: Build
        # Build your program with the given configuration.
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail.
        run: ctest -C ${{env.BUILD_TYPE}} -V

  sonar:
    name: SonarCloud
    runs-on: ubuntu-26.04
    env:
      SONAR_SCANNER_VERSION: 8.1.0.6389 # Find the latest version on the SonarScanner documentation page.
      SONAR_SERVER_URL: "https://sonarcloud.io"
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory # Directory where build-wrapper output will be placed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for better analysis relevancy.
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: 25
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Download and set up sonar-scanner
        env:
          SONAR_SCANNER_DOWNLOAD_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${{ env.SONAR_SCANNER_VERSION }}-linux-x64.zip
        run: |
          mkdir -p $HOME/.sonar
          curl -sSLo $HOME/.sonar/sonar-scanner.zip ${{ env.SONAR_SCANNER_DOWNLOAD_URL }}
          unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/
          echo "$HOME/.sonar/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-linux-x64/bin" >> $GITHUB_PATH
      - name: Download and set up build-wrapper
        env:
          BUILD_WRAPPER_DOWNLOAD_URL: ${{ env.SONAR_SERVER_URL }}/static/cpp/build-wrapper-linux-x86.zip
        run: |
          curl -sSLo $HOME/.sonar/build-wrapper-linux-x86.zip ${{ env.BUILD_WRAPPER_DOWNLOAD_URL }}
          unzip -o $HOME/.sonar/build-wrapper-linux-x86.zip -d $HOME/.sonar/
          echo "$HOME/.sonar/build-wrapper-linux-x86" >> $GITHUB_PATH
      - name: Run build-wrapper
        run: |
          mkdir build
          cmake -S . -B build
          build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} cmake --build build/ --config Release
      - name: Run sonar-scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner --define sonar.host.url="${{ env.SONAR_SERVER_URL }}" --define sonar.cfamily.build-wrapper-output="${{ env.BUILD_WRAPPER_OUT_DIR }}"
